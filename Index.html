<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客席モバイルオーダー</title>
  <style>
    /* 全体のデザイン調整 */
    body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; background-color: #f8f9fa; color: #333; overflow-x: hidden; }
    h1 { text-align: center; font-size: 1.3rem; margin: 15px 0 5px 0; }
    .tab-wrapper { position: sticky; top: 0; background-color: #f8f9fa; padding: 10px 16px; z-index: 10; border-bottom: 1px solid #e0e0e0; }
    .tab-container { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; }
    .tab-container::-webkit-scrollbar { display: none; }
    .category-tab { padding: 8px 18px; background-color: #fff; border: 1px solid #e0e0e0; border-radius: 25px; cursor: pointer; white-space: nowrap; font-weight: bold; font-size: 0.9rem; color: #666; }
    .category-tab.active { background-color: #ff9800; color: white; border-color: #ff9800; }
    .swipe-view-container { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none; }
    .swipe-view-container::-webkit-scrollbar { display: none; }
    .category-page { min-width: 100vw; box-sizing: border-box; scroll-snap-align: start; padding: 16px; }
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; margin-bottom: 100px; }
    .menu-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.04); display: flex; flex-direction: column; justify-content: space-between; position: relative; }
    .menu-img-wrapper { width: 100%; height: 110px; background-color: #eaeaea; position: relative; }
    .menu-img { width: 100%; height: 100%; object-fit: cover; }
    .no-img-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #999; font-size: 0.8rem; }
    .menu-card-body { padding: 10px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
    .menu-name { font-weight: bold; font-size: 0.95rem; margin: 0 0 4px 0; }
    .menu-price { color: #e65100; font-weight: bold; font-size: 1rem; margin: 0 0 10px 0; }
    .qty-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #ccc; background: #fff; font-weight: bold; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .add-cart-btn { width: 100%; background-color: #fff; border: 1px solid #ff9800; color: #ff9800; padding: 8px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .cart-bar { position: fixed; bottom: 0; left: 0; width: 100%; background-color: #fff; box-shadow: 0 -4px 10px rgba(0,0,0,0.1); padding: 12px 20px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
    .cart-info { font-size: 0.9rem; color: #666; }
    .checkout-btn { background-color: #ff9800; color: white; border: none; padding: 12px 24px; border-radius: 25px; font-weight: bold; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 8px rgba(255, 152, 0, 0.3); }
    .checkout-btn:disabled { background-color: #ccc; box-shadow: none; cursor: not-allowed; }
  </style>
</head>
<body>
  <h1>ご注文（卓番号: <span id="display-table-id">-</span>）</h1>
  <div class="tab-wrapper"><div id="tab-container" class="tab-container"></div></div>
  <div id="swipe-view" class="swipe-view-container"><p style="text-align: center; color: #999; width: 100vw; padding: 20px;">メニューを読み込み中...</p></div>
  <div class="cart-bar">
    <div class="cart-info"><div>選択中の商品: <span id="cart-count" style="font-weight:bold; font-size: 1.1rem; color: #ff9800;">0</span> 点</div></div>
    <button id="checkout-btn" class="checkout-btn" onclick="submitOrder()" disabled>注文を確定する</button>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwSj0WjsgBUp1DL09sq6Mo7er1PZlQM22ZQaISrUYXoKq1sifInzjtdcEr6ph0TqkY2/exec";
    const urlParams = new URLSearchParams(window.location.search);
    const tableId = urlParams.get('table') || '未設定';
    document.getElementById('display-table-id').innerText = tableId;

    let allMenus = [], categoryList = [], cart = [];

    function fetchMenus() {
      fetch(GAS_URL)
        .then(res => res.json())
        .then(data => { allMenus = data; categoryList = [...new Set(data.map(i => i.category || "その他"))]; renderTabs(categoryList); renderSwipePages(categoryList); })
        .catch(err => { console.error(err); document.getElementById('swipe-view').innerHTML = '<p>読み込み失敗</p>'; });
    }

    function renderTabs(cats) {
      const container = document.getElementById('tab-container');
      cats.forEach((cat, i) => {
        const btn = document.createElement('button');
        btn.className = `category-tab ${i === 0 ? 'active' : ''}`;
        btn.innerText = cat;
        btn.onclick = () => {
          document.querySelectorAll('.category-tab').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById(`page-${i}`).scrollIntoView({ behavior: 'smooth' });
        };
        container.appendChild(btn);
      });
    }

    function renderSwipePages(cats) {
      const swipeView = document.getElementById('swipe-view');
      cats.forEach((cat, idx) => {
        const page = document.createElement('div');
        page.className = 'category-page'; page.id = `page-${idx}`;
        const grid = document.createElement('div'); grid.className = 'menu-grid';
        allMenus.filter(i => (i.category || "その他") === cat).forEach(item => {
          const card = document.createElement('div'); card.className = 'menu-card';
          const qtyId = `qty-${idx}-${item.menu_id}`;
          card.innerHTML = `<div class="menu-img-wrapper">${item.image ? `<img src="${item.image}" class="menu-img">` : '<span class="no-img-text">No Image</span>'}</div>` +
            `<div class="menu-card-body"><p class="menu-name">${item.name}</p><p class="menu-price">${Number(item.price).toLocaleString()}円</p>` +
            `<div style="display:flex; justify-content:center; gap:10px;"><button class="qty-btn" onclick="changeQty('${qtyId}', -1)">-</button><span id="${qtyId}">1</span><button class="qty-btn" onclick="changeQty('${qtyId}', 1)">+</button></div>` +
            `<button class="add-cart-btn" onclick="addToCart('${item.menu_id}', '${item.name}', ${item.price}, '${qtyId}')">カートへ追加</button></div>`;
          grid.appendChild(card);
        });
        page.appendChild(grid); swipeView.appendChild(page);
      });
    }

    function changeQty(id, amt) { const el = document.getElementById(id); let q = parseInt(el.innerText) + amt; el.innerText = q < 1 ? 1 : q; }
    function addToCart(id, name, price, qtyId) {
      const q = parseInt(document.getElementById(qtyId).innerText);
      const ex = cart.find(i => i.menuId === id);
      ex ? ex.quantity += q : cart.push({ menuId: id, name, price, quantity: q });
      document.getElementById('cart-count').innerText = cart.reduce((sum, i) => sum + i.quantity, 0);
      document.getElementById('checkout-btn').disabled = false;
    }

    // ★ 一括送信処理（10個まとめてもエラーにならない）
    async function submitOrder() {
      if (!confirm("注文を確定しますか？")) return;
      document.getElementById('checkout-btn').disabled = true;
      try {
        const params = new URLSearchParams();
        params.append('action', 'bulk_order');
        params.append('tableId', tableId);
        params.append('cart', JSON.stringify(cart)); // カート内容をJSONでまとめて送信

        const response = await fetch(GAS_URL, { 
          method: 'POST', 
          body: params, 
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' } 
        });
        
        const result = await response.json();
        if (result.status === 'success') {
            alert('注文完了しました！');
            cart = []; document.getElementById('cart-count').innerText = '0';
        } else {
            throw new Error(result.message);
        }
      } catch (e) { 
        alert('送信エラーが発生しました。もう一度お試しください。');
        console.error(e);
      }
      document.getElementById('checkout-btn').disabled = false;
    }

    fetchMenus();
  </script>
</body>
</html>
