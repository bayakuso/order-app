<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客席モバイルオーダー</title>
  <style>
    /* 全体のデザイン調整 */
    body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; background-color: #f8f9fa; color: #333; overflow-x: hidden; }
    h1 { text-align: center; font-size: 1.3rem; margin: 15px 0 5px 0; }
    
    /* 入店時間・人数の表示バー */
    .status-bar {
      background-color: #37474f;
      color: white;
      padding: 8px 16px;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }
    .status-bar .time-highlight {
      color: #ffb74d;
    }

    /* ーーー 追加：人数選択モーダル（ポップアップ窓） ーーー */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.6);
      display: flex; justify-content: center; align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background-color: white; padding: 24px; border-radius: 16px;
      width: 85%; max-width: 320px; text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .modal-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 20px; color: #263238; }
    .modal-counter { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 24px; }
    .modal-btn {
      width: 48px; height: 48px; border-radius: 50%;
      border: 1px solid #ccc; background: #fff; font-weight: bold; font-size: 1.5rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      -webkit-tap-highlight-color: transparent;
    }
    .modal-count-display { font-size: 2rem; font-weight: bold; width: 40px; color: #ff9800; }
    .modal-submit-btn {
      width: 100%; background-color: #ff9800; color: white; border: none;
      padding: 12px; border-radius: 25px; font-weight: bold; font-size: 1rem;
      cursor: pointer; box-shadow: 0 4px 8px rgba(255, 152, 0, 0.3);
      -webkit-tap-highlight-color: transparent;
    }
