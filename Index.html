<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>御料理・御酒 注文処</title>
   <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }

    body {
      background-color: #f5f5f5;
      color: #333;
      padding-bottom: 80px;
      overflow-x: hidden; /* スワイプ時の画面ハミ出し防止 */
    }

    /* 上部ヘッダー */
    header {
      background-color: #333;
      color: #fff;
      padding: 15px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .header-title {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .table-badge {
      display: inline-block;
      background: #e0e0e0;
      color: #333;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      margin-top: 5px;
    }

    /* カテゴリタブ */
    .category-nav {
      display: flex;
      overflow-x: auto;
      background: #fff;
      border-bottom: 1px solid #ccc;
      position: sticky;
      top: 55px;
      z-index: 99;
    }
    
    .category-nav::-webkit-scrollbar {
      display: none;
    }
    
    .category-tab {
      flex: 0 0 auto;
      padding: 12px 20px;
      color: #666;
      font-weight: bold;
      border-bottom: 3px solid transparent;
      cursor: pointer;
    }
    
    .category-tab.active {
      color: #d32f2f;
      border-bottom-color: #d32f2f;
    }

    /* メニューリスト（スワイプアニメーション用設定を追加） */
    .menu-container {
      padding: 10px;
      max-width: 600px;
      margin: 0 auto;
      transition: transform 0.2s ease-out, opacity 0.2s ease-out;
    }

    .menu-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 5px;
      margin-bottom: 10px;
      overflow: hidden;
      display: flex;
      height: 100px;
    }

    .menu-img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      background-color: #eee;
      flex-shrink: 0;
    }

    .menu-details {
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-grow: 1;
      min-width: 0;
    }

    .menu-name {
      font-size: 0.95rem;
      font-weight: bold;
      color: #000;
    }

    .menu-meta {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .menu-price {
      font-size: 1.1rem;
      font-weight: bold;
      color: #d32f2f;
    }
    .menu-price::after {
      content: " 円";
      font-size: 0.8rem;
      color: #666;
    }

    .action-area {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .qty-select {
      padding: 3px;
      font-size: 0.9rem;
    }

    .add-cart-btn {
      background-color: #d32f2f;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 3px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }
    
    .add-cart-btn.has-option {
      background-color: #666;
    }

    /* 下部固定バー */
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 15px;
      z-index: 90;
    }

    .cart-info {
      color: #fff;
    }
    .cart-count {
      font-size: 0.8rem;
      color: #ccc;
    }
    .cart-total-price {
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
    }

    .cart-actions {
      display: flex;
      gap: 5px;
    }

    .bar-btn {
      padding: 8px 12px;
      border-radius: 3px;
      font-weight: bold;
      font-size: 0.85rem;
      border: none;
      cursor: pointer;
    }
    .history-btn {
      background: #555;
      color: #fff;
    }
    .view-cart-btn {
      background: #d32f2f;
      color: #fff;
    }

    /* モーダル */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .modal-sheet {
      background: #fff;
      width: 100%;
      max-width: 400px;
      border-radius: 5px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      max-height: 80vh;
    }

    .modal-header {
      background: #333;
      color: #fff;
      padding: 12px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-close {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .modal-body {
      padding: 15px;
      overflow-y: auto;
      flex-grow: 1;
    }

    .modal-footer {
      padding: 10px;
      background: #f5f5f5;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: flex-end;
      gap: 5px;
    }

    .cart-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #ddd;
    }
    .cart-item-info {
      flex-grow: 1;
    }
    .cart-item-name {
      font-weight: bold;
    }
    .cart-item-price-label {
      font-size: 0.8rem;
      color: #666;
    }

    .option-group {
      margin-bottom: 10px;
    }
    .option-title {
      font-weight: bold;
      margin-bottom: 5px;
    }
    .option-label {
      display: block;
      padding: 8px;
      border: 1px solid #ddd;
      margin-bottom: 5px;
      border-radius: 3px;
    }
    
    .guest-select-wrapper {
      position: relative;
      width: 100%;
      max-width: 200px;
      margin: 0 auto;
    }
    .guest-select {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      font-weight: bold;
      border: 1px solid #333;
      border-radius: 4px;
      background: #fff;
    }
    
    .wifi-connect-box {
      margin: 15px 0;
      padding: 12px;
      background-color: #fff;
      border: 1px dashed #333;
      border-radius: 4px;
    }
    .wifi-btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      background-color: #333;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">注文アプリ</div>
    <div class="table-badge"><span id="display-table-id">--</span> 番卓</div>
  </header>

  <nav class="category-nav" id="category-bar">
    </nav>

  <main class="menu-container" id="menu-list">
    <p style="text-align:center; padding:20px; color:#666;">データを読み込み中...</p>
  </main>

  <div class="cart-bar">
    <div class="cart-info">
      <div class="cart-count">選択中: <span id="total-count">0</span> 点</div>
      <div class="cart-total-price"><span id="total-price">0</span>円</div>
    </div>
    <div class="cart-actions">
      <button class="bar-btn history-btn" onclick="openHistoryModal()">注文履歴</button>
      <button class="bar-btn view-cart-btn" onclick="openCartModal()">カートを見る</button>
    </div>
  </div>

  <div id="customer-modal" class="modal-overlay" style="display:block;">
    <div class="modal-sheet" style="text-align:center;">
      <div class="modal-header">
        <div style="width:100%; text-align:center;">ご案内</div>
      </div>
      <div class="modal-body">
        <p style="font-size:14px; font-weight:bold; color:#d32f2f; margin-bottom:15px;">本日のお通し：特製おつまみ三品盛り</p>
        
        <div id="section-guest-select" style="margin-bottom:20px; display:none;">
          <label style="display:block;font-size:14px;margin-bottom:8px;font-weight:bold;">人数を選択してください</label>
          <div class="guest-select-wrapper">
            <select id="modal-guest-count" class="guest-select">
              <option value="1">1 名</option><option value="2">2 名</option><option value="3">3 名</option>
              <option value="4">4 名</option><option value="5">5 名</option><option value="6">6 名</option>
              <option value="7">7 名</option><option value="8">8 名</option>
            </select>
          </div>
        </div>

        <div id="section-wifi-connect" class="wifi-connect-box" style="display:none;">
          <p style="font-size:13px; margin:0 0 8px 0; font-weight:bold;">店内のWi-Fiに自動接続できます</p>
          <a href="WIFI:S:ここにSSID;T:WPA;P:ここにパスワード;;" class="wifi-btn">店舗Wi-Fiに接続</a>
        </div>

        <button onclick="submitModalQty()" style="width:80%;padding:12px;font-size:15px;font-weight:bold;background:#d32f2f;color:white;border:none;border-radius:4px;cursor:pointer;margin-top:10px;">
          お品書きを見る
        </button>
      </div>
    </div>
  </div>

  <div id="cart-modal" class="modal-overlay">
    <div class="modal-sheet">
      <div class="modal-header">
        <div>注文確認</div>
        <button class="modal-close" onclick="closeModal('cart-modal')">×</button>
      </div>
      <div class="modal-body" id="cart-list-items"></div>
      <div class="modal-footer">
        <button class="bar-btn history-btn" onclick="closeModal('cart-modal')">戻る</button>
        <button class="bar-btn view-cart-btn" id="send-order-btn" onclick="sendBulkOrder()">注文を確定する</button>
      </div>
    </div>
  </div>

  <div id="history-modal" class="modal-overlay">
    <div class="modal-sheet">
      <div class="modal-header">
        <div>注文履歴</div>
        <button class="modal-close" onclick="closeModal('history-modal')">×</button>
      </div>
      <div class="modal-body" id="history-list-items"></div>
      <div class="modal-footer">
        <button class="bar-btn view-cart-btn" onclick="closeModal('history-modal')" style="background:#555;">閉じる</button>
      </div>
    </div>
  </div>

  <div id="option-modal" class="modal-overlay">
    <div class="modal-sheet">
      <div class="modal-header">
        <div>選択</div>
        <button class="modal-close" onclick="closeModal('option-modal')">×</button>
      </div>
      <div class="modal-body">
        <div class="option-group">
          <div class="option-title">項目を選択してください</div>
          <div id="option-container-list"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="bar-btn history-btn" onclick="closeModal('option-modal')">キャンセル</button>
        <button class="bar-btn view-cart-btn" id="option-confirm-submit-btn">確定</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzvd7how1B-d5vKnCtPKSxqSpwyx-pZsHwOv6tm1YFHOt-HTuhXnaMrnoTJ6Wrx75nv9w/exec";

    const urlParams = new URLSearchParams(window.location.search);
    const tableId = urlParams.get('table') || 'A';
    const isViewer = urlParams.get('view') === 'true';

    let state = {
      allMenus: [],
      categories: [], // カテゴリー一覧の保持用
      currentCategory: '', // 初期値は空、データ取得時に最初のカテゴリーを設定
      cart: []
    };

    // スワイプ操作用の変数
    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('display-table-id').innerText = tableId;

      if (isViewer) {
        document.getElementById('customer-modal').style.display = 'block';
        document.getElementById('section-wifi-connect').style.display = 'block';
        document.getElementById('section-guest-select').style.display = 'none';
        fetchMenus();
      } else {
        document.getElementById('customer-modal').style.display = 'block';
        document.getElementById('section-wifi-connect').style.display = 'none';
        document.getElementById('section-guest-select').style.display = 'block';
      }
      updateCartTotalCount();
      setupSwipeEvents(); // スワイプイベントの登録
    });

    function setupSwipeEvents() {
      const menuList = document.getElementById('menu-list');
      
      menuList.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }, { passive: true });

      menuList.addEventListener('touchmove', (e) => {
        // 左右スワイプを滑らかに見せるための簡易エフェクト（任意）
        let moveX = e.changedTouches[0].screenX - touchStartX;
        let moveY = e.changedTouches[0].screenY - touchStartY;
        // 縦スクロールの邪魔をしないよう、横移動が強い場合のみ要素を少しずらす
        if (Math.abs(moveX) > Math.abs(moveY) && Math.abs(moveX) < 80) {
          menuList.style.transform = `translateX(${moveX}px)`;
          menuList.style.opacity = `${1 - Math.abs(moveX)/150}`;
        }
      }, { passive: true });

      menuList.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        touchEndY = e.changedTouches[0].screenY;
        menuList.style.transform = '';
        menuList.style.opacity = '';
        handleSwipeGesture();
      }, { passive: true });
    }

    function handleSwipeGesture() {
      const deltaX = touchEndX - touchStartX;
      const deltaY = touchEndY - touchStartY;
      
      // 縦スクロールと誤判定しないよう、横スワイプのしきい値を設定（最低60pxの移動）
      if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 60) {
        const currentIndex = state.categories.indexOf(state.currentCategory);
        
        if (deltaX < 0) {
          // 左スワイプ ＝ 次のカテゴリーへ（右へ移動）
          if (currentIndex < state.categories.length - 1) {
            switchCategory(state.categories[currentIndex + 1]);
          }
        } else {
          // 右スワイプ ＝ 前のカテゴリーへ（左へ移動）
          if (currentIndex > 0) {
            switchCategory(state.categories[currentIndex - 1]);
          }
        }
      }
    }

    function submitModalQty() {
      if (!isViewer) {
        const guestCount = document.getElementById('modal-guest-count').value;
        const now = new Date();
        const timeStr = ('0' + now.getHours()).slice(-2) + ':' + ('0' + now.getMinutes()).slice(-2);
        
        urlParams.set('num', guestCount);
        urlParams.set('time', encodeURIComponent(timeStr));
        window.history.replaceState({}, '', `${window.location.pathname}?${urlParams.toString()}`);
        fetchMenus();
      }
      closeModal('customer-modal');
    }

    async function fetchMenus() {
      try {
        const response = await fetch(GAS_URL);
        const data = await response.json();
        state.allMenus = data;
        
        // 「すべて」を除外し、存在する固有のカテゴリーのみを抽出して保持
        state.categories = [...new Set(state.allMenus.map(m => m.category).filter(Boolean))];
        
        // 初期カテゴリーを先頭の項目に設定
        if (state.categories.length > 0) {
          state.currentCategory = state.categories[0];
        }
        
        buildCategoryBar();
        renderMenuList();
      } catch (err) {
        document.getElementById('menu-list').innerHTML = `<p style="text-align:center;color:red;padding:20px;">お品書きの取得に失敗しました。<br>${err.toString()}</p>`;
      }
    }

    function buildCategoryBar() {
      const bar = document.getElementById('category-bar');
      bar.innerHTML = '';
      
      state.categories.forEach(cat => {
        const tab = document.createElement('div');
        tab.className = `category-tab ${state.currentCategory === cat ? 'active' : ''}`;
        tab.innerText = cat;
        tab.onclick = () => switchCategory(cat);
        bar.appendChild(tab);
      });
      scrollToActiveTab();
    }

    function switchCategory(cat) {
      state.currentCategory = cat;
      
      // タブの表示状態を更新
      const tabs = document.querySelectorAll('.category-tab');
      tabs.forEach(t => {
        if(t.innerText === cat) {
          t.classList.add('active');
        } else {
          t.classList.remove('active');
        }
      });
      
      scrollToActiveTab();
      renderMenuList();
    }

    // アクティブなタブが画面外に隠れないよう自動スクロール
    function scrollToActiveTab() {
      const activeTab = document.querySelector('.category-tab.active');
      if (activeTab) {
        activeTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }
    }

    function renderMenuList() {
      const listContainer = document.getElementById('menu-list');
      listContainer.innerHTML = '';

      // 現在選択されている特定のカテゴリーのみを抽出
      const filtered = state.allMenus.filter(m => m.category === state.currentCategory);

      if (filtered.length === 0) {
        listContainer.innerHTML = '<p style="text-align:center;color:#999;padding:20px;">お品書きがありません。</p>';
        return;
      }

      // 表示切り替え時のフェードイン演出（スワイプ感の向上）
      listContainer.style.opacity = 0;
      
      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'menu-card';

        const imgSrc = item.image_base64 || item.image || '';
        const qtyId = `qty-${item.menu_id}`;

        let qtyOptions = '';
        for(let idx = 1; idx <= 10; idx++) {
          qtyOptions += `<option value="${idx}">${idx}</option>`;
        }

        const rawOptionValue = item.options || item.option || item.Options || item.Option || item.オプション || '';

        let buttonHtml = '';
        if (rawOptionValue && String(rawOptionValue).trim() !== '') {
          item.options = String(rawOptionValue).trim();
          buttonHtml = `<button class="add-cart-btn has-option" onclick="openOptionModal('${item.menu_id}', '${qtyId}')">選択</button>`;
        } else {
          buttonHtml = `<button class="add-cart-btn" onclick="addToCart('${item.menu_id}', '${qtyId}')">追加</button>`;
        }

        card.innerHTML = `
          <img src="${imgSrc}" class="menu-img" alt="${item.name}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22><rect width=%22100%22 height=%22100%22 fill=%22%23eee%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-size=%2212%22 fill=%22%23aaa%22>画像なし</text></svg>';">
          <div class="menu-details">
            <div class="menu-name">${item.name}</div>
            <div class="menu-meta">
              <div class="menu-price">${Number(item.price).toLocaleString()}</div>
              <div class="action-area">
                <select id="${qtyId}" class="qty-select">${qtyOptions}</select>
                ${buttonHtml}
              </div>
            </div>
          </div>
        `;
        listContainer.appendChild(card);
      });

      setTimeout(() => { listContainer.style.opacity = 1; }, 50);
    }

    function openOptionModal(menuId, qtyId) {
      const item = state.allMenus.find(m => m.menu_id == menuId);
      const qty = document.getElementById(qtyId).value;
      
      const modal = document.getElementById('option-modal');
      modal.querySelector('.option-title').innerText = `${item.name} (${qty}点)の項目を選択してください`;
      const container = document.getElementById('option-container-list');
      container.innerHTML = '';

      const opts = item.options.split(/[,、\s]+/);
      opts.forEach((opt, index) => {
        const trimmedOpt = opt.trim();
        if (!trimmedOpt) return;
        
        const lbl = document.createElement('label');
        lbl.className = 'option-label';
        lbl.innerHTML = `<input type="radio" name="menu-option-radio" value="${trimmedOpt}" ${index === 0 ? 'checked' : ''}> ${trimmedOpt}`;
        container.appendChild(lbl);
      });

      document.getElementById('option-confirm-submit-btn').onclick = () => {
        const selectedOpt = document.querySelector('input[name="menu-option-radio"]:checked').value;
        executeAddToCart(item, qty, selectedOpt);
        closeModal('option-modal');
      };

      modal.style.display = 'flex';
    }

    function addToCart(menuId, qtyId) {
      const item = state.allMenus.find(m => m.menu_id == menuId);
      const qty = document.getElementById(qtyId).value;
      executeAddToCart(item, qty, null);
    }

    function executeAddToCart(item, qty, optionText) {
      const quantity = Number(qty);
      const finalName = optionText ? `${item.name} [${optionText}]` : item.name;

      const existing = state.cart.find(c => c.name === finalName);
      if (existing) {
        existing.quantity += quantity;
      } else {
        state.cart.push({
          menu_id: item.menu_id,
          name: finalName,
          price: Number(item.price),
          quantity: quantity
        });
      }
      updateCartTotalCount();
    }

    function updateCartTotalCount() {
      const totalQty = state.cart.reduce((sum, c) => sum + c.quantity, 0);
      const totalPrice = state.cart.reduce((sum, c) => sum + (c.price * c.quantity), 0);
      
      document.getElementById('total-count').innerText = totalQty;
      document.getElementById('total-price').innerText = totalPrice.toLocaleString();
    }

    function openCartModal() {
      const container = document.getElementById('cart-list-items');
      container.innerHTML = '';

      if (state.cart.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:#999;padding:20px 0;">カートは空です。</p>';
        document.getElementById('send-order-btn').disabled = true;
      } else {
        document.getElementById('send-order-btn').disabled = false;
        state.cart.forEach((item, index) => {
          const row = document.createElement('div');
          row.className = 'cart-item-row';
          row.innerHTML = `
            <div class="cart-item-info">
              <div class="cart-item-name">${item.name}</div>
              <div class="cart-item-price-label">${item.price.toLocaleString()}円 × ${item.quantity}</div>
            </div>
            <button onclick="removeFromCart(${index})" style="color:#d32f2f; background:none; border:none; font-weight:bold; padding:5px;">取消</button>
          `;
          container.appendChild(row);
        });
      }
      document.getElementById('cart-modal').style.display = 'flex';
    }

    function removeFromCart(index) {
      state.cart.splice(index, 1);
      updateCartTotalCount();
      openCartModal();
    }

    async function openHistoryModal() {
      const container = document.getElementById('history-list-items');
      container.innerHTML = '<p style="text-align:center; color:#888; padding:15px 0;">最新状態を取得中...</p>';
      document.getElementById('history-modal').style.display = 'flex';

      try {
        const res = await fetch(`${GAS_URL}?mode=kitchen`);
        const data = await res.json();
        
        const currentTableOrders = (data.orders || []).filter(o => String(o.tableId).trim() === String(tableId).trim());

        container.innerHTML = '';
        
        if (currentTableOrders.length === 0) {
          container.innerHTML = '<p style="text-align:center; color:#888; padding:15px 0;">注文履歴はありません。</p>';
          return;
        }

        currentTableOrders.reverse().forEach((item) => {
          const row = document.createElement('div');
          row.className = 'cart-item-row';
          const cleanName = item.menuName.replace(/<br\s*\/?>/gi, '').replace(/\n/g, '');
          
          let statusLabel = '';
          if (item.status === '提供済' || item.status === '提供済み') {
            statusLabel = '<span style="color: #4caf50; font-weight: bold; background: #e8f5e9; padding: 2px 6px; border-radius: 3px; font-size: 0.75rem;">提供済</span>';
          } else {
            statusLabel = '<span style="color: #ff9800; font-weight: bold; background: #fff3e0; padding: 2px 6px; border-radius: 3px; font-size: 0.75rem;">調理中</span>';
          }

          row.innerHTML = `
            <div class="cart-item-info">
              <div class="cart-item-name">${cleanName}</div>
              <div class="cart-item-price-label" style="margin-top: 3px;">${statusLabel} <span style="color:#999; margin-left:5px;">${item.time}</span></div>
            </div>
            <div style="font-weight: bold; color: #333;">${item.quantity} 点</div>
          `;
          container.appendChild(row);
        });

      } catch (e) {
        console.error(e);
        container.innerHTML = '<p style="text-align:center; color:red; padding:15px 0;">履歴の取得に失敗しました。</p>';
      }
    }

    async function sendBulkOrder() {
      const btn = document.getElementById('send-order-btn');
      btn.disabled = true;
      btn.innerText = "送信中...";

      try {
        const postUrl = `${GAS_URL}?action=bulk_order&tableId=${encodeURIComponent(tableId)}`;
        const formData = new FormData();
        formData.append('cart', JSON.stringify(state.cart));

        const response = await fetch(postUrl, {
          method: 'POST',
          body: formData
        });
        const result = await response.json();

        if (result.status === 'success') {
          alert('注文を送信しました。');
          state.cart = [];
          updateCartTotalCount();
          closeModal('cart-modal');
        } else {
          alert(`エラー: ${result.message}`);
          btn.disabled = false;
          btn.innerText = "注文を確定する";
        }
      } catch (err) {
        alert(`通信失敗: ${err.toString()}`);
        btn.disabled = false;
        btn.innerText = "注文を確定する";
      }
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }
  </script>
</body>
</html>
