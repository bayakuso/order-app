<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客席モバイルオーダー</title>
  <style>
    /* 全体のデザイン調整 */
    body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; background-color: #f8f9fa; color: #333; overflow-x: hidden; }
    h1 { text-align: center; font-size: 1.3rem; margin: 15px 0 5px 0; }
    
    /* 入店時間・人数の表示バー */
    .status-bar {
      background-color: #37474f;
      color: white;
      padding: 8px 16px;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }
    .status-bar .time-highlight {
      color: #ffb74d;
    }

    /* ーーー モーダル（共通デザイン） ーーー */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.6);
      display: flex; justify-content: center; align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background-color: white; padding: 24px; border-radius: 16px;
      width: 85%; max-width: 320px; text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .modal-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 20px; color: #263238; }
    .modal-counter { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 24px; }
    .modal-btn {
      width: 48px; height: 48px; border-radius: 50%;
      border: 1px solid #ccc; background: #fff; font-weight: bold; font-size: 1.5rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      -webkit-tap-highlight-color: transparent;
    }
    .modal-count-display { font-size: 2rem; font-weight: bold; width: 40px; color: #ff9800; }
    
    /* ボタンのレイアウト用 */
    .modal-submit-btn {
      width: 100%; background-color: #ff9800; color: white; border: none;
      padding: 12px; border-radius: 25px; font-weight: bold; font-size: 1rem;
      cursor: pointer; box-shadow: 0 4px 8px rgba(255, 152, 0, 0.3);
      -webkit-tap-highlight-color: transparent;
    }
    .modal-btn-group {
      display: flex; gap: 12px; margin-top: 20px;
    }
    .modal-cancel-btn {
      flex: 1; background-color: #eceff1; color: #546e7a; border: none;
      padding: 12px; border-radius: 25px; font-weight: bold; font-size: 1rem;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .modal-confirm-btn {
      flex: 1; background-color: #ff9800; color: white; border: none;
      padding: 12px; border-radius: 25px; font-weight: bold; font-size: 1rem;
      cursor: pointer; box-shadow: 0 4px 8px rgba(255, 152, 0, 0.3);
      -webkit-tap-highlight-color: transparent;
    }

    .tab-wrapper { position: sticky; top: 0; background-color: #f8f9fa; padding: 10px 16px; z-index: 10; border-bottom: 1px solid #e0e0e0; }
    .tab-container { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .tab-container::-webkit-scrollbar { display: none; }
    .category-tab { padding: 8px 18px; background-color: #fff; border: 1px solid #e0e0e0; border-radius: 25px; cursor: pointer; white-space: nowrap; font-weight: bold; font-size: 0.9rem; color: #666; -webkit-tap-highlight-color: transparent; }
    .category-tab.active { background-color: #ff9800; color: white; border-color: #ff9800; }
    .swipe-view-container { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .swipe-view-container::-webkit-scrollbar { display: none; }
    .category-page { min-width: 100vw; box-sizing: border-box; scroll-snap-align: start; padding: 16px; }
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; margin-bottom: 100px; }
    .menu-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.04); display: flex; flex-direction: column; justify-content: space-between; position: relative; }
    .menu-img-wrapper { width: 100%; height: 110px; background-color: #eaeaea; position: relative; }
    .menu-img { width: 100%; height: 100%; object-fit: cover; }
    .no-img-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #999; font-size: 0.8rem; }
    .menu-card-body { padding: 10px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
    .menu-name { font-weight: bold; font-size: 0.95rem; margin: 0 0 4px 0; }
    .menu-price { color: #e65100; font-weight: bold; font-size: 1rem; margin: 0 0 10px 0; }
    .qty-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #ccc; background: #fff; font-weight: bold; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; }
    .add-cart-btn { width: 100%; background-color: #fff; border: 1px solid #ff9800; color: #ff9800; padding: 8px; border-radius: 8px; font-weight: bold; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .cart-bar { position: fixed; bottom: 0; left: 0; width: 100%; background-color: #fff; box-shadow: 0 -4px 10px rgba(0,0,0,0.1); padding: 12px 20px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
    .cart-info { font-size: 0.9rem; color: #666; }
    .checkout-btn { background-color: #ff9800; color: white; border: none; padding: 12px 24px; border-radius: 25px; font-weight: bold; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 8px rgba(255, 152, 0, 0.3); -webkit-tap-highlight-color: transparent; }
    .checkout-btn:disabled { background-color: #ccc; box-shadow: none; cursor: not-allowed; }
  </style>
</head>
<body>

  <div id="customer-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-title">ご来店人数を入力してください</div>
      <div class="modal-counter">
        <button class="modal-btn" onclick="changeModalQty(-1)">-</button>
        <span id="modal-count" class="modal-count-display">2</span>
        <button class="modal-btn" onclick="changeModalQty(1)">+</button>
      </div>
      <button class="modal-submit-btn" onclick="submitModalQty()">確定してメニューへ</button>
    </div>
  </div>

  <div id="order-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-title" style="margin-bottom: 10px;">注文を確定しますか？</div>
      <p style="color: #666; font-size: 0.9rem; margin-bottom: 24px;">カートに入っている商品を厨房へ送信します。</p>
      <div class="modal-btn-group">
        <button class="modal-cancel-btn" onclick="closeOrderModal()">戻る</button>
        <button class="modal-confirm-btn" onclick="executeOrderSubmit()">注文する</button>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <div>👥 人数: <span id="display-customer-count">-</span> 名様</div>
    <div>🍻 乾杯: <span id="display-start-time" class="time-highlight">--:--</span></div>
  </div>

  <h1>ご注文（卓番号: <span id="display-table-id">-</span>）</h1>
  <div class="tab-wrapper"><div id="tab-container" class="tab-container"></div></div>
  <div id="swipe-view" class="swipe-view-container"><p style="text-align: center; color: #999; width: 100vw; padding: 20px;">メニューを読み込み中...</p></div>
  <div class="cart-bar">
    <div class="cart-info"><div>選択中の商品: <span id="cart-count" style="font-weight:bold; font-size: 1.1rem; color: #ff9800;">0</span> 点</div></div>
    <button id="checkout-btn" class="checkout-btn" onclick="openOrderModal()" disabled>注文を確定する</button>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzvd7how1B-d5vKnCtPKSxqSpwyx-pZsHwOv6tm1YFHOt-HTuhXnaMrnoTJ6Wrx75nv9w/exec";
    
    const urlParams = new URLSearchParams(window.location.search);
    const tableId = urlParams.get('table') || '未設定';
    document.getElementById('display-table-id').innerText = tableId;

    let allMenus = [], categoryList = [], cart = [];
    let isTabClicking = false;
    let clickTimeout;
    let tempCustomerCount = 2;

    function changeModalQty(amt) {
      tempCustomerCount += amt;
      if (tempCustomerCount < 1) tempCustomerCount = 1;
      document.getElementById('modal-count').innerText = tempCustomerCount;
    }

    document.addEventListener("DOMContentLoaded", function() {
        document.getElementById('modal-count').innerText = tempCustomerCount;
    });

    function submitModalQty() {
      document.getElementById('display-customer-count').innerText = tempCustomerCount;

      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('display-start-time').innerText = hours + ':' + minutes;

      document.getElementById('customer-modal').style.display = 'none';

      fetchMenus();
    }

    // ーーー 追加：注文モーダルの制御 ーーー
    function openOrderModal() {
      document.getElementById('order-modal').style.display = 'flex';
    }

    function closeOrderModal() {
      document.getElementById('order-modal').style.display = 'none';
    }

    // ーーー 変更：実際の送信処理（confirmを撤去） ーーー
    async function executeOrderSubmit() {
      // モーダルを閉じてボタンを無効化
      closeOrderModal();
      document.getElementById('checkout-btn').disabled = true;
      
      try {
        const params = new URLSearchParams();
        params.append('action', 'bulk_order');
        params.append('tableId', tableId);
        params.append('cart', JSON.stringify(cart));

        const response = await fetch(GAS_URL, { 
          method: 'POST', 
          body: params, 
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' } 
        });
        
        const result = await response.json();
        if (result.status === 'success') {
            alert('注文完了しました！'); // ※ここも追々綺麗にできます
            cart = []; 
            document.getElementById('cart-count').innerText = '0';
            document.getElementById('checkout-btn').disabled = true;
        } else {
            throw new Error(result.message);
        }
      } catch (e) { 
        alert('送信エラーが発生しました。もう一度お試しください。');
        console.error(e);
      }
      document.getElementById('checkout-btn').disabled = false;
    }

    function fetchMenus() {
      fetch(GAS_URL)
        .then(res => res.json())
        .then(data => { 
          allMenus = data; 
          categoryList = [];
          for(let i=0; i<data.length; i++) {
            let cat = data[i].category || "その他";
            if(categoryList.indexOf(cat) === -1) categoryList.push(cat);
          }
          renderTabs(categoryList); 
          renderSwipePages(categoryList); 
          initSwipeListener();
        })
        .catch(err => { 
          console.error(err); 
          document.getElementById('swipe-view').innerHTML = '<p style="text-align:center; color:red; padding:20px;">読み込み失敗。URLやGASの設定を確認してください。</p>'; 
        });
    }

    function renderTabs(cats) {
      const container = document.getElementById('tab-container');
      container.innerHTML = '';
      cats.forEach((cat, i) => {
        const btn = document.createElement('button');
        btn.className = 'category-tab' + (i === 0 ? ' active' : '');
        btn.id = 'tab-btn-' + i;
        btn.innerText = cat;
        btn.onclick = () => {
          isTabClicking = true;
          clearTimeout(clickTimeout);
          
          document.querySelectorAll('.category-tab').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          
          const tabContainer = document.getElementById('tab-container');
          tabContainer.scrollLeft = btn.offsetLeft - (tabContainer.clientWidth / 2) + (btn.clientWidth / 2);
          
          const targetPage = document.getElementById('page-' + i);
          if(targetPage) {
            document.getElementById('swipe-view').scrollLeft = targetPage.offsetLeft;
          }
          
          clickTimeout = setTimeout(() => { isTabClicking = false; }, 500);
        };
        container.appendChild(btn);
      });
    }

    function renderSwipePages(cats) {
      const swipeView = document.getElementById('swipe-view');
      swipeView.innerHTML = '';
      cats.forEach((cat, idx) => {
        const page = document.createElement('div');
        page.className = 'category-page'; page.id = 'page-' + idx;
        const grid = document.createElement('div'); grid.className = 'menu-grid';
        
        const filtered = allMenus.filter(i => (i.category || "その他") === cat);
        filtered.forEach(item => {
          const card = document.createElement('div'); card.className = 'menu-card';
          const qtyId = 'qty-' + idx + '-' + item.menu_id;
          card.innerHTML = '<div class="menu-img-wrapper">' + (item.image ? '<img src="' + item.image + '" class="menu-img">' : '<span class="no-img-text">No Image</span>') + '</div>' +
            '<div class="menu-card-body"><p class="menu-name">' + item.name + '</p><p class="menu-price">' + Number(item.price).toLocaleString() + '円</p>' +
            '<div style="display:flex; justify-content:center; gap:10px;"><button class="qty-btn" onclick="changeQty(\'' + qtyId + '\', -1)">-</button><span id="' + qtyId + '">1</span><button class="qty-btn" onclick="changeQty(\'' + qtyId + '\', 1)">+</button></div>' +
            '<button class="add-cart-btn" onclick="addToCart(\'' + item.menu_id + '\', \'' + item.name + '\', ' + item.price + ', \'' + qtyId + '\')">カートへ追加</button></div>';
          grid.appendChild(card);
        });
        page.appendChild(grid); swipeView.appendChild(page);
      });
    }

    function initSwipeListener() {
      const swipeView = document.getElementById('swipe-view');
      swipeView.addEventListener('scroll', () => {
        if (isTabClicking) return;

        const width = swipeView.clientWidth;
        const scrollLeft = swipeView.scrollLeft;
        const currentIdx = Math.round(scrollLeft / width);
        
        const targetTab = document.getElementById('tab-btn-' + currentIdx);
        if (targetTab && !targetTab.classList.contains('active')) {
          document.querySelectorAll('.category-tab').forEach(b => b.classList.remove('active'));
          targetTab.classList.add('active');
          
          const tabContainer = document.getElementById('tab-container');
          tabContainer.scrollLeft = targetTab.offsetLeft - (tabContainer.clientWidth / 2) + (targetTab.semibold ? targetTab.clientWidth / 2 : targetTab.clientWidth / 2);
        }
      });
    }

    function changeQty(id, amt) { const el = document.getElementById(id); let q = parseInt(el.innerText) + amt; el.innerText = q < 1 ? 1 : q; }
    
    function addToCart(id, name, price, qtyId) {
      const q = parseInt(document.getElementById(qtyId).innerText);
      const ex = cart.find(i => i.menuId === id);
      ex ? ex.quantity += q : cart.push({ menuId: id, name: name, price: price, quantity: q });
      document.getElementById('cart-count').innerText = cart.reduce((sum, i) => sum + i.quantity, 0);
      document.getElementById('checkout-btn').disabled = false;
    }

    // 元のsubmitOrder関数は撤去し、新設した二つの関数に分割・統合しました
  </script>
</body>
</html>
