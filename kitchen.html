<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>厨房キッチンモニター</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
      background-color: #222;
      color: #fff;
    }
    h1 {
      margin: 0 0 15px 0;
      font-size: 1.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-btns {
      display: flex;
      gap: 10px;
    }
    button {
      padding: 10px 15px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .add-btn { background-color: #2196F3; color: white; }
    
    /* 注文カードのグリッド */
    .order-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
    }
    .order-card {
      background-color: #333;
      border-left: 8px solid #ff9800;
      border-radius: 6px;
      padding: 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #444;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .table-no { font-size: 1.4rem; font-weight: bold; color: #ff9800; }
    .order-time { color: #aaa; font-size: 0.9rem; }
    .menu-details { font-size: 1.3rem; font-weight: bold; margin: 10px 0; }
    .quantity { color: #f44336; font-size: 1.5rem; margin-left: 10px; }
    
    .card-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .done-btn { flex: 2; background-color: #4CAF50; color: white; font-size: 1.1rem; }
    .cancel-btn { flex: 1; background-color: #555; color: #eee; font-size: 0.9rem; }

    /* モーダル（口頭注文追加のポップアップ） */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 100;
    }
    .modal-content {
      background: #333; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px;
    }
    .modal-content label { display: block; margin: 10px 0 5px; color: #ccc; }
    .modal-content input, .modal-content select {
      width: 100%; padding: 10px; box-sizing: border-box; background: #444; color: white; border: 1px solid #555; border-radius: 4px;
    }
    .modal-actions { display: flex; gap: 10px; margin-top: 15px; }
  </style>
</head>
<body>

  <h1>
    🍳 厨房モニター
    <div class="header-btns">
      <button class="add-btn" onclick="openModal()">＋ 口頭注文を追加</button>
    </div>
  </h1>

  <!-- 注文一覧 -->
  <div id="kitchen-container" class="order-grid">
    <p style="color:#aaa; text-align:center; width:100%;">注文を読み込み中...</p>
  </div>

  <!-- 口頭注文用のポップアップ -->
  <div id="orderModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-top:0;">🗣️ 口頭注文の追加</h3>
      
      <label>卓番号</label>
      <input type="text" id="modalTableId" placeholder="例: 5">
      
      <label>メニュー</label>
      <select id="modalMenuSelect">
        <!-- JSで自動挿入 -->
      </select>
      
      <label>数量</label>
      <input type="number" id="modalQuantity" value="1" min="1">
      
      <div class="modal-actions">
        <button style="flex:1; background:#444; color:white;" onclick="closeModal()">閉じる</button>
        <button style="flex:1; background:#2196F3; color:white;" onclick="submitOralOrder()">注文を確定</button>
      </div>
    </div>
  </div>

  <script>
    // 【重要】新しくデプロイしたGASのURLに差し替えてください
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyQ6eL6p1unQH8MeNjFXOJaq9bclIBMbbbS3ybjZVPSOlmBWDUMfqrnVHLbUbpqPvqI-w/exec";

    let menuList = [];

    // 1. 厨房用データを読み込む関数
    function loadKitchenData() {
      fetch(`${GAS_URL}?mode=kitchen`)
        .then(response => response.json())
        .then(data => {
          menuList = data.menus;
          updateMenuSelect(data.menus);
          renderOrders(data.orders);
        })
        .catch(err => console.error("データ取得エラー:", err));
    }

    // 2. 注文カードを画面に描画
    function renderOrders(orders) {
      const container = document.getElementById('kitchen-container');
      container.innerHTML = '';

      if (orders.length === 0) {
        container.innerHTML = '<p style="color:#666; text-align:center; width:100%; margin-top:40px; font-size:1.2rem;">現在、調理中の注文はありません。</p>';
        return;
      }

      orders.forEach(order => {
        const card = document.createElement('div');
        card.className = 'order-card';
        card.innerHTML = `
          <div>
            <div class="card-top">
              <span class="table-no">${order.tableId} 卓</span>
              <span class="order-time">${order.time}</span>
            </div>
            <div class="menu-details">
              ${order.menuName} <span class="quantity">× ${order.quantity}</span>
            </div>
          </div>
          <div class="card-actions">
            <button class="cancel-btn" onclick="updateStatus('${order.orderId}', 'キャンセル', '${order.menuName}')">取消</button>
            <button class="done-btn" onclick="updateStatus('${order.orderId}', '提供済', '${order.menuName}')">提供</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // 3. 提供済 or キャンセルのステータス更新処理
    function updateStatus(orderId, status, menuName) {
      if(!confirm(`【${menuName}】を「${status}」にしますか？`)) return;

      const params = new URLSearchParams();
      params.append('action', 'update_status');
      params.append('orderId', orderId);
      params.append('status', status);

      fetch(GAS_URL, {
        method: 'POST',
        body: params,
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
      })
      .then(response => response.json())
      .then(res => {
        if(res.status === 'success') {
          loadKitchenData(); // 画面を再読み込み
        } else {
          alert("エラー: " + res.message);
        }
      })
      .catch(err => alert("通信に失敗しました。"));
    }

    // 4. 口頭注文モーダル内のセレクトボックス作成
    function updateMenuSelect(menus) {
      const select = document.getElementById('modalMenuSelect');
      if(select.children.length > 0) return; // 既に作成済ならスキップ
      
      menus.forEach(menu => {
        const opt = document.createElement('option');
        opt.value = menu.menu_id;
        opt.innerText = `${menu.name} (${menu.price}円)`;
        select.appendChild(opt);
      });
    }

    // モーダルの開閉
    function openModal() { document.getElementById('orderModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('orderModal').style.display = 'none'; }

    // 5. 口頭注文の送信
    function submitOralOrder() {
      const tableId = document.getElementById('modalTableId').value.trim();
      const menuId = document.getElementById('modalMenuSelect').value;
      const quantity = document.getElementById('modalQuantity').value;

      if(!tableId) { alert("卓番号を入力してください"); return; }

      const params = new URLSearchParams();
      params.append('tableId', tableId);
      params.append('menuId', menuId);
      params.append('quantity', quantity);

      fetch(GAS_URL, {
        method: 'POST',
        body: params,
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
      })
      .then(response => response.json())
      .then(res => {
        if(res.status === 'success') {
          alert("口頭注文を追加しました");
          closeModal();
          document.getElementById('modalTableId').value = ''; // リセット
          loadKitchenData(); // 再読み込み
        }
      })
      .catch(err => alert("追加に失敗しました。"));
    }

    // 最初の一回を実行
    loadKitchenData();
    // 5秒ごとに自動で注文をチェックする（超便利機能！）
    setInterval(loadKitchenData, 5000);
  </script>
</body>
</html>
