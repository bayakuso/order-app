<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店員用レジ・集計画面</title>
    <style>
        body { font-family: sans-serif; background-color: #eceff1; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #37474f; }
        .btn-refresh { background-color: #2196f3; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-size: 1em; cursor: pointer; display: block; margin: 0 auto 20px; }
        .table-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .table-card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-top: 5px solid #e53935; background-color: #fff8f8; }
        .table-name { font-size: 1.3em; font-weight: bold; margin-bottom: 10px; color: #263238; }
        .order-item { display: flex; justify-content: space-between; font-size: 0.9em; color: #555; margin-bottom: 5px; padding-bottom: 5px; border-bottom: 1px dashed #eee; }
        .total-price { text-align: right; font-size: 1.2em; font-weight: bold; color: #d32f2f; margin-top: 15px; }
        .btn-checkout { background-color: #4caf50; color: white; border: none; width: 100%; padding: 10px; border-radius: 5px; font-size: 1em; cursor: pointer; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>📊 店員用レジ・会計管理</h1>
    <button class="btn-refresh" onclick="loadActiveOrders()">🔄 画面を更新する</button>

    <div id="cashier-list" class="table-list">注文データを読み込み中...</div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzvd7how1B-d5vKnCtPKSxqSpwyx-pZsHwOv6tm1YFHOt-HTuhXnaMrnoTJ6Wrx75nv9w/exec";

        window.addEventListener('DOMContentLoaded', loadActiveOrders);

        async function loadActiveOrders() {
            try {
                const container = document.getElementById('cashier-list');
                container.innerHTML = "読み込み中...";

                const response = await fetch(GAS_URL + "?mode=cashier");
                const orders = await response.json();
                
                container.innerHTML = ''; 

                if (Object.keys(orders).length === 0) {
                    container.innerHTML = "<p style='text-align:center; width:100%; color:#777;'>現在、未会計の注文はありません。</p>";
                    return;
                }

                for (const tableId in orders) {
                    const tableData = orders[tableId];
                    let itemsHtml = '';
                    tableData.items.forEach(item => {
                        itemsHtml += `
                            <div class="order-item">
                                <span>${item.name} x ${item.quantity}</span>
                                <span>¥${item.subtotal}</span>
                            </div>
                        `;
                    });

                    const cardHtml = `
                        <div class="table-card">
                            <div class="table-name">${tableId} 番卓</div>
                            <div class="order-details">${itemsHtml}</div>
                            <div class="total-price">合計: ¥${tableData.total}</div>
                            <button class="btn-checkout" onclick="checkout('${tableId}', ${tableData.total})">会計完了処理</button>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', cardHtml);
                }
            } catch (e) {
                document.getElementById('cashier-list').innerText = 'データの読み込みに失敗しました。';
                console.error(e);
            }
        }

        async function checkout(tableId, total) {
            if (!confirm(tableId + "番卓の会計を完了しますか？")) return;

            try {
                const formData = new URLSearchParams();
                // 【修正】action を 'checkout' から 'final_checkout' に変更し、GASの決済処理を正しく呼び出す
                formData.append('action', 'final_checkout');
                formData.append('tableId', tableId);

                const response = await fetch(GAS_URL, {
                    method: "POST",
                    body: formData,
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                });
                
                const result = await response.json();
                if(result.status === 'success') {
                    alert("会計処理完了しました！");
                    loadActiveOrders(); 
                } else {
                    alert("エラー: " + result.message);
                }
            } catch (e) {
                alert("会計処理に失敗しました: " + e);
            }
        }
    </script>
</body>
</html>
